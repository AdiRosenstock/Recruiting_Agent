services:
  db:
    image: postgres:16-alpine
    container_name: recruiting_agent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recruiting_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruiting_agent}
      POSTGRES_DB: ${POSTGRES_DB:-recruiting_agent}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - recruiting_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recruiting_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recruiting_agent_pgdata:
