[project]
name = "recruiting-agent-backend"
version = "0.1.0"
description = "Personal startup recruiting CRM + research agent -- backend"
requires-python = ">=3.11"
readme = "../README.md"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.12",
    "python-dateutil>=2.9",
    "openai>=1.50",
    "anthropic>=0.36",
    "httpx>=0.27",  # used directly by discovery adapters (HN API, GitHub raw fetch)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx2>=2.9",  # starlette's TestClient prefers this over httpx now
    "ruff>=0.7",
    "mypy>=1.12",
    "types-python-dateutil",
    "reportlab>=4.2",  # only used to generate a synthetic PDF fixture for tests
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
# Alembic autogenerates versions/*.py; they're not hand-styled and shouldn't be hand-edited for lint.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]  # FastAPI's Depends(...) as a default arg is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
